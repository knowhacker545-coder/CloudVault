<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard — CloudVault</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">Cloud<span>Vault</span></div>
      <div class="user-pill">
        <div class="avatar" id="avatar-initial"></div>
        <span id="user-name"></span>
        <button class="btn btn-secondary" id="logout-btn" style="padding:7px 14px; font-size:0.8rem;">Logout</button>
      </div>
    </div>

    <div class="sidebar">
      <nav>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="dashboard.html">Files</a>
        <a href="shared.html">Shared</a>
        <a href="dashboard.html">Recent</a>
        <a href="trash.html">Trash</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>

    <div class="main">
      <div class="overview-row">
        <div class="card gauge-card">
          <div class="eyebrow">Storage</div>
          <div class="gauge-wrap">
            <svg viewBox="0 0 140 140">
              <circle class="gauge-track" cx="70" cy="70" r="60" />
              <circle class="gauge-fill" id="gauge-fill" cx="70" cy="70" r="60"
                transform="rotate(-90 70 70)" />
            </svg>
            <div class="gauge-center">
              <div class="gauge-pct" id="gauge-pct">0%</div>
              <div class="gauge-sub" id="gauge-sub">0 MB / 10 GB</div>
            </div>
          </div>
        </div>

        <div class="quick-actions">
          <div class="action-row">
            <button class="btn" id="upload-btn">+ Upload File</button>
            <input type="file" id="file-input" hidden />
          </div>
          <div class="search-row">
            <input type="text" id="search-input" placeholder="Search files…" />
          </div>
          <div id="category-grid" class="category-grid"></div>
        </div>
      </div>

      <h3 class="section-title">My Files</h3>
      <div id="file-list" class="file-list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
