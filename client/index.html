<style>
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .hero .vault-dial {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -50%);
    opacity: 0.18;
    pointer-events: none;
  }
  .hero .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 18px;
    position: relative; z-index: 1;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 3rem;
    line-height: 1.15;
    max-width: 640px;
    margin: 0 0 18px;
    position: relative; z-index: 1;
  }
  .hero h1 em { color: var(--brass); font-style: italic; }
  .hero p { color: var(--muted); max-width: 460px; margin-bottom: 32px; font-size: 1.02rem; position: relative; z-index: 1; }
  .hero .actions { display: flex; gap: 14px; position: relative; z-index: 1; }
  @media (max-width: 640px) { .hero h1 { font-size: 2.1rem; } }
</style>
